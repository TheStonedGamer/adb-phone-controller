[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adb-phone-controller"
dynamic = ["version"]
description = "Desktop Android controller with embedded scrcpy video and touch input"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.4,<7", "av>=14,<20"]

[project.optional-dependencies]
webcam = ["pyvirtualcam>=0.15,<0.16", "numpy>=1.26,<3"]

[project.scripts]
adb-phone-control = "adb_phone_controller.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adb_phone_controller = ["vendor/*", "vendor/scrcpy/*"]

[tool.setuptools.dynamic]
version = {attr = "adb_phone_controller.__version__"}
