[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adb-phone-controller"
version = "0.1.0"
description = "Desktop Android controller with embedded scrcpy video and touch input"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.4,<7", "av>=14,<20"]

[project.scripts]
adb-phone-control = "adb_phone_controller.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adb_phone_controller = ["vendor/*", "vendor/scrcpy/*"]
