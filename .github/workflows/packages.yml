name: Packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/version.py
  debian:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build_linux.py --deb
      - name: Install and check package on Debian 13
        run: |
          docker run --rm -v "$PWD:/src:ro" debian:13 sh -c '
            apt-get update &&
            apt-get install -y /src/dist/*.deb &&
            QT_QPA_PLATFORM=offscreen adb-phone-control --version &&
            /usr/lib/adb-phone-controller/adb_phone_controller/vendor/scrcpy/adb version &&
            /usr/lib/adb-phone-controller/adb_phone_controller/vendor/scrcpy/scrcpy --version'
      - uses: actions/upload-artifact@v4
        with:
          name: debian
          path: dist/*.deb
  arch:
    needs: validate
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm git python curl
      - uses: actions/checkout@v4
      - run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE' && python tools/build_linux.py --arch"
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: |
            dist/*.pkg.tar.zst
            dist/*.tar.gz
            dist/PKGBUILD
  windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller "PySide6>=6.4,<7" "av>=14,<20" "pyvirtualcam>=0.15,<0.16" "numpy>=1.26,<3"
      - run: python tools/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [debian, arch, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          path: source
      - name: Generate package checksums
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path('artifacts')
          files = sorted(p for p in root.iterdir() if p.is_file())
          (root / 'SHA256SUMS').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files))
          PY
      - name: Publish release after all platform checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Android ADB Controller $GITHUB_REF_NAME" --notes-file source/RELEASE_NOTES.md
          fi
          gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest --title "Android ADB Controller $GITHUB_REF_NAME" --notes-file source/RELEASE_NOTES.md
